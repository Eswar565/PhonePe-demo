<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Transfer - PhonePe</title>
    <link rel="stylesheet" href="demo.css">
</head>
<body>

    <!-- Real SMS Confirmation Modal -->
    <div id="smsModal" class="sms-modal hidden">
        <div class="sms-modal-content">
            <div class="sms-modal-header">
                <span class="sms-modal-tag">✉️ Real SMS Generated</span>
                <span class="sms-modal-time" id="smsTime">Just now</span>
            </div>
            <div class="sms-modal-recipient" id="smsRecipient">To: +91 XXXXXXXXXX</div>
            <div class="sms-modal-text" id="smsText">Message content</div>
            
            <div class="sms-modal-actions">
                <a id="openSmsBtn" class="open-sms-btn" href="#">
                    📱 Open in Messages App
                </a>
                <button class="sms-dismiss-btn" onclick="closeSmsModal()">
                    Done
                </button>
            </div>
        </div>
    </div>

    <header>
        PhonePe
    </header>

    <div class="container">

        <!-- Balance Card -->
        <div class="card">
            <p>Demo Balance</p>
            <h1 id="balance">₹10,000</h1>
        </div>

        <!-- Transfer Card -->
        <div class="card">
            <h2>Send Money via SMS</h2>

            <label for="mobile" class="input-label">Receiver's 10-Digit Mobile Number</label>
            <input type="tel" id="mobile" placeholder="e.g. 9876543210" maxlength="10">

            <label for="amount" class="input-label">Transfer Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g. 500">

            <button id="transferBtn" onclick="transfer()">
                Pay & Send SMS
            </button>
        </div>

        <!-- Transactions Card -->
        <div class="card">
            <h2>Transaction History</h2>
            <div id="notifications"></div>
        </div>

    </div>

    <script src="demo.js"></script>

</body>
</html>
